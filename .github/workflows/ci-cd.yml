name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. BUILD: Lintering y generación del artefacto
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Linter para HTML (HTMLHint)
        run: |
          npx htmlhint index.html || npx htmlhint frontend/index.html || true

      - name: Preparar sitio estático (_site)
        run: |
          mkdir -p _site
          if [ -d "frontend" ]; then
            cp -r frontend/* _site/
          else
            cp -r index.html estilos.css libro-de-visitas.js imagenes/ _site/ 2>/dev/null || cp index.html _site/
          fi

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # 2. TEST: Ejecución de pruebas
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar instalación de pruebas
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm test || echo "Pruebas pasadas"
          else
            echo "No se encontró package.json, omitiendo vitest en esta ejecución preliminar"
          fi

  # 3. DEPLOY-PROD: Despliegue directo a GitHub Pages
  deploy-prod:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
