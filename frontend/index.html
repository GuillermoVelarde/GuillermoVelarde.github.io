<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guillermo Velarde</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
   <h1 class="titulo">Guillermo Velarde, Ingeniería Informática</h1>
    <p>Estudiante de Ingeniería Informática en la Universidad Ricardo Palma</p>
  </header>

  <main>
    <section id="sobre-mi">
      <h2>Sobre mí</h2>
      <p>Aquí va tu presentación del LAB-01.</p>
    </section>

    <!-- ═══════════ LIBRO DE VISITAS: esto es lo nuevo del LAB-02 ═══════════
         Copia esta sección (y los dos archivos que enlaza) a TU index.html.
         Arranca oculta: libro-de-visitas.js la muestra solo si la API responde.
         Por eso tu página sigue funcionando en GitHub Pages, donde no hay backend. -->
    <section id="libro-de-visitas" hidden>
      <h2>Libro de visitas</h2>

      <form id="form-mensaje">
        <label>Tu nombre
          <input name="nombre" maxlength="60" required>
        </label>
        <label>Tu mensaje
          <textarea name="mensaje" maxlength="280" rows="3" required></textarea>
        </label>
        <button type="submit">Dejar mensaje</button>
        <p id="form-estado" role="status"></p>
      </form>

      <ul id="lista-mensajes"></ul>
    </section>
  </main>

  <footer>
    <p>Hecho con Git, GitHub Pages y Docker. IF-1116, 2026-II</p>
  </footer>

  <script src="libro-de-visitas.js" defer></script>
</body>
</html>
